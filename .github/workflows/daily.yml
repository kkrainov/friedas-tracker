name: Daily Price Tracker

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  track-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install pandas requests lxml html5lib openpyxl

      - name: Run Scraper & Check Prices
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "PriceBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add friedas_data.csv
          # The commit message includes the date
          git commit -m "Update: $(date +'%Y-%m-%d')" || exit 0
          git push
